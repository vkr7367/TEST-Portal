<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEST - 72th BPSC Target Test Portal</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-hover: #334155;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --success-color: #10b981;
            --error-color: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            border: 1px solid #334155;
        }

        h1 {
            font-size: 1.8rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .status-badge {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .test-card {
            background: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s, background 0.2s;
        }

        .test-card:hover {
            transform: translateY(-3px);
            background: var(--card-hover);
        }

        .test-title {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .test-date {
            color: #38bdf8;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .test-meta {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            border: 1px solid #334155;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: var(--bg-color);
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <h1>72nd BPSC Target Test Portal</h1>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;">Cloud Synced Live Portal</p>
            </div>
            <div style="display: flex; align-items: center; gap: 15px;">
                <span class="status-badge"><i class="fa-solid fa-cloud"></i> Cloud Synced</span>
                <button class="btn" onclick="openAddModal()"><i class="fa-solid fa-plus"></i> Add Test</button>
            </div>
        </header>

        <div id="testGrid" class="test-grid">
            <!-- Dynamic tests will load here -->
        </div>
    </div>

    <!-- Add Test Modal -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <h2 style="margin-bottom: 20px;">Add New Test</h2>
            <div class="form-group">
                <label>Test Title</label>
                <input type="text" id="testTitle" placeholder="e.g., Modern History Mock Test 1">
            </div>
            <div class="form-group">
                <label>Test Date</label>
                <input type="date" id="testDate">
            </div>
            <div class="form-group">
                <label>Description / Details</label>
                <textarea id="testDesc" rows="3" placeholder="Test syllabus or notes..."></textarea>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                <button class="btn" style="background: #475569;" onclick="closeAddModal()">Cancel</button>
                <button class="btn" onclick="saveNewTest()">Save Test</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AizSyDJRPVw03gH0XULysTKxP_r1POFRDrVDBK",
            authDomain: "testportaldb-27776.firebaseapp.com",
            projectId: "testportaldb-27776",
            storageBucket: "testportaldb-27776.firebasestorage.app",
            messagingSenderId: "644831282943",
            appId: "1:644831282943:web:90e4655a020067f835eeca",
            measurementId: "G-SZFE10KZPG"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.openAddModal = function() {
            document.getElementById('addModal').style.display = 'flex';
        }

        window.closeAddModal = function() {
            document.getElementById('addModal').style.display = 'none';
        }

        window.saveNewTest = async function() {
            const title = document.getElementById('testTitle').value.trim();
            const date = document.getElementById('testDate').value;
            const desc = document.getElementById('testDesc').value.trim();

            if (!title) {
                alert('Please enter a test title');
                return;
            }

            try {
                await addDoc(collection(db, "tests"), {
                    title: title,
                    testDate: date || 'No Date',
                    description: desc,
                    createdAt: serverTimestamp()
                });
                closeAddModal();
                document.getElementById('testTitle').value = '';
                document.getElementById('testDate').value = '';
                document.getElementById('testDesc').value = '';
                loadTests();
            } catch (e) {
                console.error("Error adding document: ", e);
                alert("Error saving test.");
            }
        }

        async function loadTests() {
            const grid = document.getElementById('testGrid');
            grid.innerHTML = '<p style="color: var(--text-muted);">Loading tests from cloud...</p>';

            try {
                const querySnapshot = await getDocs(collection(db, "tests"));
                grid.innerHTML = '';
                
                if (querySnapshot.empty) {
                    grid.innerHTML = '<p style="color: var(--text-muted);">No tests found yet. Click "Add Test" to create one!</p>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const test = doc.data();
                    const card = document.createElement('div');
                    card.className = 'test-card';
                    card.innerHTML = `
                        <div class="test-title">${escapeHtml(test.title)}</div>
                        <div class="test-date"><i class="fa-regular fa-calendar"></i> ${escapeHtml(test.testDate)}</div>
                        <div class="test-meta">${escapeHtml(test.description || 'No description provided')}</div>
                    `;
                    grid.appendChild(card);
                });
            } catch (e) {
                console.error("Error loading tests: ", e);
                grid.innerHTML = '<p style="color: var(--error-color);">Error loading tests from cloud database.</p>';
            }
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        window.onload = loadTests;
    </script>
</body>
</html>
